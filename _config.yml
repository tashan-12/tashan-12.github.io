# Hexo 配置
# 文档: https://hexo.io/zh-cn/docs/configuration.html

# 站点信息
title: tashan's notes
subtitle: 个人笔记与文章
description: 记录技术学习与生活思考
keywords:
author: tashan
language: zh-CN
timezone: Asia/Shanghai

# URL
url: https://tashan-12.github.io/
permalink: :year/:month/:day/:title/
permalink_defaults:
pretty_urls:
  trailing_index: true
  trailing_html: true

# 目录
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# 写作
new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
syntax_highlighter: highlight.js
include:
exclude:
ignore:

# 首页分页
index_generator:
  path: ''
  per_page: 10
  order_by: -date

# 分类 / 标签
category_generator:
  per_page: 10
  order_by: -date
tag_generator:
  per_page: 10
  order_by: -date

# 日期格式
date_format: YYYY-MM-DD
time_format: HH:mm:ss

# 分页
per_page: 10
pagination_dir: page

# 主题（使用 npm 安装的 landscape，保持与原站点一致）
theme: landscape

# 部署（实际部署由 GitHub Actions 完成，这里保留结构）
deploy:
  type: ''
